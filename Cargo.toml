[package]
name = "bsv-sdk"
version = "0.8.1"
edition = "2021"
rust-version = "1.87"
description = "Pure Rust implementation of the BSV Blockchain SDK"
license-file = "LICENSE"
repository = "https://github.com/b1narydt/bsv-rust-sdk"
readme = "README.md"
documentation = "https://docs.rs/bsv-sdk"
keywords = ["bsv", "bitcoin", "blockchain", "sdk", "cryptography"]
categories = ["cryptography", "authentication"]
# Developer-local reference symlink is not part of the distributable crate.
exclude = ["/.ref"]

[lib]
name = "bsv"

[profile.test]
opt-level = 2

[dependencies]
# Lazy singletons (curve, base point) that work in no_std + alloc.
once_cell = { version = "1", default-features = false, features = ["alloc", "race"] }
thiserror = { version = "2.0", default-features = false }
# OS entropy. Enabled by `std`. no_std callers install `random::set_rng_hook`.
getrandom = { version = "0.2", optional = true }
# Async trait objects (script templates, broadcaster, chain tracker, wallet).
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# serde_json and indexmap are not hard deps of the no_std core. `std` enables
# them so the historical default API stays intact (`BroadcastFailure.more`,
# IndexMap fields) without turning on serde derives. `serde` enables them too.
serde_json = { version = "1", optional = true }
indexmap = { version = "2", optional = true, default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bignumber_bench"
harness = false

[[bench]]
name = "bn_serialization_bench"
harness = false

[[bench]]
name = "ecc_scalar_bench"
harness = false

[[bench]]
name = "script_findanddelete_bench"
harness = false

[[bench]]
name = "script_serialization_bench"
harness = false

[[bench]]
name = "symmetric_key_bench"
harness = false

[[bench]]
name = "transaction_bench"
harness = false

[[bench]]
name = "atomic_beef_bench"
harness = false

[[bench]]
name = "reader_writer_bench"
harness = false

[[bench]]
name = "ecdsa_bench"
harness = false

[[bench]]
name = "hash_bench"
harness = false

[[bench]]
name = "ecies_bench"
harness = false

[[bench]]
name = "dispatch_bench"
harness = false

[[bench]]
name = "auth_message_bench"
harness = false
required-features = ["network"]

[[example]]
name = "wallet_client_action"
required-features = ["network"]

[[example]]
name = "overlay_probe"
required-features = ["network"]

[[example]]
name = "token_lifecycle"
required-features = ["network"]

[[example]]
name = "generate_auth_certificate_rust_vector"
path = "tests/vectors/generate_auth_certificate_rust_vector.rs"
required-features = ["serde"]

[features]
# Default matches the historical crate: full std surface, no serde derives,
# no network stack. `--no-default-features` is no_std + alloc.
default = ["std"]
# OS entropy, std::io errors, and every module that needs fs/net/thread/time
# (auth, wallet, services, remittance, broadcasters, chain trackers, BEEF,
# Merkle proofs). Also enables `async` and the serde_json/indexmap types that
# are part of the default public API without the `serde` derives.
std = [
    "dep:getrandom",
    "async",
    "dep:serde_json",
    "dep:indexmap",
    "indexmap/std",
    "thiserror/std",
]
# async-trait. Pulled in by `std`, so default builds keep async
# `ScriptTemplateUnlock`, `Broadcaster`, and `ChainTracker`. A no_std build
# leaves it off; P2PKH/RPuzzle locking and sighash preimages stay available.
async = ["dep:async-trait"]
# Serialize/Deserialize derives, plus serde_json and indexmap (ordered maps
# and `BroadcastFailure.more`) so those crates are not hard deps of no_std.
serde = ["dep:serde", "dep:serde_json", "dep:indexmap", "indexmap/serde"]
# `network` still transitively enables `serde` and `std`, so any existing
# `--features network` consumer is unchanged.
network = [
    "std",
    "serde",
    "async",
    "dep:tokio",
    "dep:reqwest",
    "dep:tokio-tungstenite",
    "dep:futures-util",
]
# The SDK is entropy-backend-agnostic. On `wasm32-unknown-unknown` getrandom has
# no default entropy source, so the consumer MUST choose a backend: enable
# `wasm-js` for a browser / Node host (`crypto.getRandomValues`), or register a
# custom backend themselves (e.g. an enclave / WASI attested RNG). A library must
# not force the backend on downstream crates (per getrandom's own guidance).
wasm-js = ["getrandom?/js"]
